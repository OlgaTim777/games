<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verb Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body, #app { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  
  .vg-root {
    --vg-bg1: #5b6cf9; --vg-bg2: #a855f7; --vg-bg3: #ff7eb3;
    --vg-btn: #2ec4b6; --vg-btn-dark: #198d82;
    --vg-card: rgba(255, 255, 255, 0.95); --vg-text: #1f2544;
    position: relative; width: 100%; height: 100%; overflow: hidden;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--vg-text);
    background: linear-gradient(135deg, var(--vg-bg1), var(--vg-bg2) 55%, var(--vg-bg3));
    background-size: cover; background-position: center;
    user-select: none; display: flex; flex-direction: column;
  }

  /* Автоматическая тематика для каждого из 7 шаблонов */
  .vg-root[data-palette="auto-template"][data-template="boss"] {
    --vg-bg1: #2b103f; --vg-bg2: #8c1d40; --vg-bg3: #ea580c;
    --vg-btn: #f97316; --vg-btn-dark: #b45309;
  }
  .vg-root[data-palette="auto-template"][data-template="alchemy"] {
    --vg-bg1: #1e1040; --vg-bg2: #4c1d95; --vg-bg3: #0f766e;
    --vg-btn: #10b981; --vg-btn-dark: #047857;
  }
  .vg-root[data-palette="auto-template"][data-template="bubbles"] {
    --vg-bg1: #0369a1; --vg-bg2: #0284c7; --vg-bg3: #2dd4bf;
    --vg-btn: #06b6d4; --vg-btn-dark: #0e7490;
  }
  .vg-root[data-palette="auto-template"][data-template="timemachine"] {
    --vg-bg1: #0f172a; --vg-bg2: #312e81; --vg-bg3: #0284c7;
    --vg-btn: #38bdf8; --vg-btn-dark: #0369a1;
  }
  .vg-root[data-palette="auto-template"][data-template="vault"] {
    --vg-bg1: #291811; --vg-bg2: #5c2d16; --vg-bg3: #a16207;
    --vg-btn: #eab308; --vg-btn-dark: #a16207;
  }
  .vg-root[data-palette="auto-template"][data-template="spelling"] {
    --vg-bg1: #1e3a5f; --vg-bg2: #2563eb; --vg-bg3: #0ea5e9;
    --vg-btn: #f59e0b; --vg-btn-dark: #b45309;
  }
  .vg-root[data-palette="auto-template"][data-template="memory"] {
    --vg-bg1: #064e3b; --vg-bg2: #0f766e; --vg-bg3: #1d4ed8;
    --vg-btn: #f59e0b; --vg-btn-dark: #b45309;
  }

  /* Ручные общие палитры */
  .vg-root[data-palette="sunny-castle"] {
    --vg-bg1: #38bdf8; --vg-bg2: #6366f1; --vg-bg3: #f472b6;
    --vg-btn: #22c55e; --vg-btn-dark: #15803d;
  }
  .vg-root[data-palette="magic-forest"] {
    --vg-bg1: #10b981; --vg-bg2: #0ea5e9; --vg-bg3: #8b5cf6;
    --vg-btn: #f97316; --vg-btn-dark: #c2410c;
  }
  .vg-root[data-palette="candy-land"] {
    --vg-bg1: #fb7185; --vg-bg2: #f472b6; --vg-bg3: #fbbf24;
    --vg-btn: #a855f7; --vg-btn-dark: #7e22ce;
  }
  .vg-root[data-palette="galaxy-quest"] {
    --vg-bg1: #1e1b4b; --vg-bg2: #4c1d95; --vg-bg3: #db2777;
    --vg-btn: #f59e0b; --vg-btn-dark: #b45309;
  }

  .vg-scene-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.95; }
  .vg-scene-layer svg { width: 100%; height: 100%; display: block; }
  .vg-root.has-custom-bg .vg-scene-layer { display: none; }

  .vg-bg-overlay {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 18% 18%, rgba(255,255,255,0.16), transparent 48%),
                radial-gradient(circle at 82% 82%, rgba(0,0,0,0.18), transparent 52%);
  }
  .vg-confetti { position: absolute; inset: 0; pointer-events: none; z-index: 40; }

  .vg-hud {
    position: relative; z-index: 15; padding: 6px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    background: rgba(12, 16, 40, 0.34); backdrop-filter: blur(8px); color: #fff; flex-shrink: 0;
  }
  .vg-hud-group { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .vg-pill {
    background: rgba(255, 255, 255, 0.94); color: #1f2544;
    padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 900;
    display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 2px 0 rgba(0,0,0,0.16);
  }
  .vg-pill.retry-badge { background: linear-gradient(90deg, #ff7a3d, #f43f5e); color: #fff; font-size: 11.5px; }
  .vg-progress-wrap {
    width: 100px; height: 10px; background: rgba(255,255,255,0.28);
    border-radius: 999px; overflow: hidden; border: 2px solid rgba(255,255,255,0.6);
  }
  .vg-progress-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #ffe066, #22c55e);
    transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .vg-icon-btn {
    border: none; width: 32px; height: 32px; border-radius: 10px;
    background: rgba(255,255,255,0.92); color: #1f2544; font-size: 15px; cursor: pointer;
    display: grid; place-items: center; box-shadow: 0 2px 0 rgba(0,0,0,0.18); transition: transform 0.12s;
  }
  .vg-icon-btn:active { transform: translateY(2px); }
  .vg-mode-select {
    border: 2px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.96);
    color: #1f2544; border-radius: 9px; padding: 3px 7px; font-family: inherit;
    font-size: 11.5px; font-weight: 800; cursor: pointer;
  }

  .vg-stage {
    position: relative; flex: 1; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 10px 14px; min-height: 0; overflow: hidden;
  }

  .vg-screen {
    background: var(--vg-card); border-radius: 28px; padding: 22px 26px;
    max-width: 580px; max-height: 96%; overflow-y: auto; width: 94%; text-align: center;
    box-shadow: 0 18px 44px rgba(10, 16, 48, 0.38), inset 0 4px 0 #fff;
    border: 4px solid #fff; animation: vgPopIn 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .vg-start-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(90deg, #6366f1, #ec4899); color: #fff;
    padding: 5px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 900;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); margin-bottom: 10px;
  }
  .vg-screen-emblem {
    width: 84px; height: 84px; margin: 0 auto 8px; border-radius: 22px;
    display: grid; place-items: center; font-size: 54px;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.18));
  }
  .vg-screen-emblem.has-img {
    width: 112px; height: 112px; overflow: hidden; border: 4px solid #fde047;
    background: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.2); filter: none;
  }
  .vg-screen-emblem img { width: 100%; height: 100%; object-fit: cover; }
  .vg-screen h1 { margin: 0 0 6px; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: clamp(22px, 3.2vw, 31px); color: #2b2d6e; }
  .vg-screen p { margin: 0 0 14px; font-size: 14.5px; font-weight: 700; color: #55608a; line-height: 1.4; }
  .vg-screen-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }

  .vg-reward-card {
    display: inline-flex; align-items: center; gap: 12px; text-align: left;
    padding: 10px 18px; border-radius: 20px; margin: 6px 0 12px; max-width: 100%;
    border: 3px solid #fde047; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.22);
    animation: vgPopIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .vg-reward-card.style-gold { background: linear-gradient(135deg, #f59e0b, #d97706 55%, #b45309); border-color: #fef08a; }
  .vg-reward-card.style-emerald { background: linear-gradient(135deg, #10b981, #059669 55%, #047857); border-color: #a7f3d0; }
  .vg-reward-card.style-royal { background: linear-gradient(135deg, #6366f1, #7c3aed 55%, #a855f7); border-color: #ddd6fe; }
  .vg-reward-card.style-ruby { background: linear-gradient(135deg, #f43f5e, #e11d48 55%, #be123c); border-color: #fecdd3; }
  .vg-reward-card.style-try { background: linear-gradient(135deg, #475569, #334155); border-color: #cbd5e1; }
  .vg-reward-ico {
    width: 54px; height: 54px; border-radius: 15px; flex-shrink: 0;
    background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.6);
    display: grid; place-items: center; font-size: 32px; overflow: hidden;
  }
  .vg-reward-ico img { width: 100%; height: 100%; object-fit: cover; }
  .vg-reward-meta .rk { font-size: 10.5px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.7px; opacity: 0.9; }
  .vg-reward-meta .rt { font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 19px; font-weight: 700; line-height: 1.15; }

  .vg-cta {
    border: none; border-radius: 18px; padding: 12px 26px;
    font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 18px; font-weight: 700;
    color: #fff; background: linear-gradient(180deg, var(--vg-btn), var(--vg-btn-dark));
    box-shadow: 0 6px 0 var(--vg-btn-dark), 0 10px 20px rgba(0,0,0,0.22);
    cursor: pointer; transition: transform 0.12s;
  }
  .vg-cta:hover { transform: translateY(-2px) scale(1.03); }
  .vg-cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--vg-btn-dark); }
  .vg-cta.retry { background: linear-gradient(180deg, #ff8a3d, #e11d48); box-shadow: 0 6px 0 #9f1239, 0 10px 20px rgba(225, 29, 72, 0.28); }
  .vg-cta.retry:active { box-shadow: 0 2px 0 #9f1239; }

  .vg-mistakes-box { background: #fff1f2; border: 2px solid #fecdd3; border-radius: 15px; padding: 9px 12px; margin: 0 0 12px; text-align: center; }
  .vg-mistakes-title { font-size: 12px; font-weight: 900; color: #be123c; margin-bottom: 5px; }
  .vg-mistakes-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-height: 70px; overflow-y: auto; }
  .vg-mistake-chip { background: #fff; border: 1.5px solid #fda4af; color: #881337; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 800; }
  .vg-perfect-badge { display: inline-block; background: #dcfce7; border: 2px solid #86efac; color: #166534; border-radius: 999px; padding: 4px 13px; font-size: 12.5px; font-weight: 900; margin: 0 0 12px; }

  .vg-stars { font-size: 34px; letter-spacing: 6px; margin: 4px 0 6px; }
  .vg-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 12px; }
  .vg-stat-box { background: #f1f5ff; border-radius: 13px; padding: 7px; }
  .vg-stat-box .val { font-size: 19px; font-weight: 900; color: #3b42c4; }
  .vg-stat-box .lbl { font-size: 11px; font-weight: 800; color: #647096; }

  .vg-feedback-banner {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: #1f2544; color: #fff; padding: 8px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 800; z-index: 30; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; white-space: nowrap;
  }
  .vg-feedback-banner.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .vg-feedback-banner.ok { background: #16a34a; }
  .vg-feedback-banner.err { background: #dc2626; }

  .vg-verb-pic {
    width: clamp(58px, 9vh, 84px); height: clamp(58px, 9vh, 84px);
    border-radius: 16px; object-fit: cover; border: 3px solid #fff;
    box-shadow: 0 6px 14px rgba(0,0,0,0.2); flex-shrink: 0; background: #fff;
  }

  .vg-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .vg-opt-btn {
    border: 3px solid #dbe4ff; border-radius: 18px; padding: clamp(14px, 2.4vh, 22px) 16px;
    background: #fff; font-family: 'Fredoka', 'Nunito', sans-serif;
    font-size: clamp(20px, 2.8vw, 28px); font-weight: 700; color: #242952;
    cursor: pointer; box-shadow: 0 6px 0 #c7d4f6;
    transition: transform 0.12s, background 0.15s, border-color 0.15s;
  }
  .vg-opt-btn:hover { transform: translateY(-2px); border-color: #818cf8; background: #f8faff; }
  .vg-opt-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c7d4f6; }
  .vg-opt-btn.correct { background: #22c55e; color: #fff; border-color: #16a34a; box-shadow: 0 6px 0 #15803d; }
  .vg-opt-btn.wrong { background: #ef4444; color: #fff; border-color: #dc2626; box-shadow: 0 6px 0 #b91c1c; animation: vgShake 0.35s; }

  /* 1. БИТВА С БОССОМ */
  .tpl-boss { width: 100%; max-width: 1060px; height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .boss-arena {
    display: flex; align-items: center; gap: 18px; width: 100%;
    background: linear-gradient(90deg, rgba(45,10,28,0.88), rgba(124,45,18,0.86));
    border-radius: 22px; padding: 12px 20px; border: 3px solid rgba(253, 186, 116, 0.75);
    box-shadow: 0 10px 26px rgba(0,0,0,0.34); color: #fff; flex-shrink: 0;
  }
  .boss-avatar {
    width: clamp(78px, 11vh, 108px); height: clamp(78px, 11vh, 108px);
    border-radius: 22px; background: radial-gradient(circle, #fef08a, #f97316);
    display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
    border: 3px solid #fde047; box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    animation: vgFloat 2.6s ease-in-out infinite;
  }
  .boss-avatar img, .boss-avatar svg { width: 100%; height: 100%; object-fit: cover; }
  .boss-avatar.hit { animation: vgHit 0.45s ease; }
  .boss-info { flex: 1; text-align: left; }
  .boss-hp-label { font-size: 14.5px; font-weight: 900; color: #fed7aa; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .boss-hp-bar { height: 22px; background: rgba(0,0,0,0.42); border-radius: 999px; overflow: hidden; border: 2px solid #fb923c; }
  .boss-hp-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #f97316, #fde047); transition: width 0.35s ease; }
  .boss-card {
    flex: 1; width: 100%; background: rgba(255,255,255,0.96); border-radius: 26px;
    padding: 18px 24px; text-align: center; border: 4px solid #fff;
    box-shadow: 0 14px 36px rgba(15, 10, 40, 0.3);
    display: flex; flex-direction: column; justify-content: space-between; align-items: center; min-height: 0;
  }
  .vg-target-badge {
    display: inline-block; background: linear-gradient(90deg, #dc2626, #f97316);
    color: #fff; padding: 5px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 900;
  }
  .boss-prompt-wrap { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .boss-verb {
    font-family: 'Fredoka', 'Nunito', sans-serif; font-size: clamp(34px, 5.4vw, 56px);
    color: #1f2544; margin: 0; display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .boss-trans { font-size: clamp(16px, 2.2vw, 22px); font-weight: 800; color: #647096; }
  .boss-answer-area { width: 100%; }
  .typing-row { display: flex; gap: 12px; max-width: 540px; margin: 0 auto; }
  .typing-row input {
    flex: 1; font-size: 24px; font-family: 'Fredoka', 'Nunito', sans-serif;
    text-align: center; padding: 13px 16px; border: 3px solid #c7d2fe; border-radius: 18px;
  }

  /* 2. ВОЛШЕБНЫЙ КОТЕЛ */
  .tpl-alchemy { width: 100%; max-width: 1060px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 12px; min-height: 0; }
  .alchemy-scroll {
    width: 100%; background: linear-gradient(180deg, #fffbeb, #fef3c7);
    border: 4px solid #f59e0b; border-radius: 24px; padding: 14px 20px; text-align: center;
    box-shadow: 0 10px 28px rgba(0,0,0,0.28); flex-shrink: 0;
  }
  .alchemy-head-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .alchemy-trans { font-family: 'Fredoka', 'Nunito', sans-serif; font-size: clamp(24px, 3.6vw, 36px); color: #78350f; }
  .alchemy-slots { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .alchemy-slot {
    min-width: clamp(145px, 22%, 220px); padding: 11px 16px; border-radius: 16px;
    border: 3px dashed #d97706; background: rgba(255,255,255,0.85);
    font-weight: 900; font-size: clamp(18px, 2.3vw, 24px); color: #b45309; transition: all 0.2s;
  }
  .alchemy-slot.active { border-style: solid; border-color: #7c3aed; background: #f5f3ff; color: #5b21b6; box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.22); }
  .alchemy-slot.filled { border-style: solid; border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .cauldron-stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .cauldron-zone {
    width: clamp(175px, 24vw, 240px); height: clamp(128px, 21vh, 175px);
    border-radius: 32px; background: radial-gradient(circle at 50% 25%, #6d28d9, #1e1040 82%);
    border: 4px solid #34d399; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 12px 32px rgba(16, 185, 129, 0.35); transition: transform 0.2s, box-shadow 0.2s;
  }
  .cauldron-zone.drag-over { transform: scale(1.1); box-shadow: 0 0 36px #34d399; }
  .cauldron-zone.splash { animation: vgPopIn 0.35s; }
  .cauldron-zone.smoke { animation: vgShake 0.35s; }
  .cauldron-art { width: clamp(78px, 12vh, 114px); height: clamp(70px, 11vh, 102px); display: grid; place-items: center; }
  .cauldron-art svg, .cauldron-art img { width: 100%; height: 100%; object-fit: contain; border-radius: 14px; }
  .cauldron-hint { font-size: 12px; font-weight: 800; color: #a7f3d0; }
  .alchemy-shelf {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%;
    background: rgba(15, 10, 38, 0.42); border: 2px solid rgba(167, 243, 208, 0.35);
    border-radius: 22px; padding: 14px; flex-shrink: 0;
  }
  .ingr-card {
    background: linear-gradient(180deg, #ffffff, #ecfdf5); border: 3px solid #34d399;
    border-radius: 17px; padding: 12px 22px; font-family: 'Fredoka', 'Nunito', sans-serif;
    font-size: clamp(20px, 2.6vw, 26px); font-weight: 700; color: #064e3b;
    cursor: grab; box-shadow: 0 6px 0 #059669; transition: transform 0.14s, opacity 0.2s;
  }
  .ingr-card:hover { transform: translateY(-3px) scale(1.05); }
  .ingr-card:active { cursor: grabbing; }
  .ingr-card.used { opacity: 0.22; pointer-events: none; transform: scale(0.86); }
  .ingr-card.wrong { animation: vgShake 0.35s; border-color: #ef4444; background: #fee2e2; }

  /* 3. ЛОПНИ ФОРМУ */
  .tpl-bubbles { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
  .bubbles-banner {
    position: relative; z-index: 12; align-self: center;
    background: rgba(255,255,255,0.96); border: 4px solid #7dd3fc; border-radius: 24px;
    padding: 10px 26px; display: flex; align-items: center; gap: 14px; text-align: left;
    box-shadow: 0 10px 28px rgba(3, 105, 161, 0.34);
  }
  .bubbles-banner .main { font-family: 'Fredoka', 'Nunito', sans-serif; font-size: clamp(24px, 3.6vw, 36px); color: #0c4a6e; }
  .bubbles-banner .sub { font-size: 14.5px; font-weight: 900; color: #0284c7; }
  .bubbles-field { position: relative; flex: 1; width: 100%; overflow: hidden; }
  .vg-bubble {
    position: absolute; min-width: clamp(118px, 14vw, 152px); height: clamp(118px, 14vw, 152px);
    padding: 0 16px; border-radius: 999px;
    background: radial-gradient(circle at 28% 24%, rgba(255,255,255,0.98), rgba(186, 230, 253, 0.8) 52%, rgba(56, 189, 248, 0.85));
    border: 4px solid rgba(255,255,255,0.95);
    box-shadow: inset -8px -12px 22px rgba(2, 132, 199, 0.32), 0 12px 24px rgba(12, 74, 110, 0.28);
    display: grid; place-items: center; font-family: 'Fredoka', 'Nunito', sans-serif;
    font-size: clamp(20px, 2.6vw, 27px); font-weight: 700; color: #082f49;
    cursor: pointer; transition: transform 0.12s; will-change: transform;
  }
  .vg-bubble:hover { transform: scale(1.08); }

  }
  .vault-chest.unlocked { border-color: #4ade80; box-shadow: 0 0 38px rgba(74, 222, 128, 0.72), 0 16px 36px rgba(0,0,0,0.45); }
  .vault-header { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .vault-lock-ico { width: 58px; height: 58px; display: grid; place-items: center; font-size: 46px; }
  .vault-lock-ico img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; border: 2px solid #fde047; }
  .vault-clue-label { font-size: 12.5px; font-weight: 800; color: #fde68a; text-transform: uppercase; letter-spacing: 0.7px; }
  .vault-trans { font-family: 'Fredoka', 'Nunito', sans-serif; font-size: clamp(26px, 3.8vw, 40px); color: #fff; text-shadow: 0 3px 6px rgba(0,0,0,0.45); }
  .vault-dials { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; align-items: stretch; }
  .vault-dial {
    background: linear-gradient(180deg, #1f172a, #332347); border: 3.5px solid #fbbf24;
    border-radius: 22px; padding: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; gap: 10px;

  .vault-dial.locked { border-color: #4ade80; background: linear-gradient(180deg, #143628, #1c4d39); }
  .vault-dial.ok { border-color: #4ade80; box-shadow: 0 0 22px rgba(74, 222, 128, 0.6); }
  .vault-dial.err { border-color: #f87171; box-shadow: 0 0 20px rgba(248, 113, 113, 0.65); animation: vgShake 0.35s; }
  .dial-tag { font-size: 13px; font-weight: 900; color: #fde68a; letter-spacing: 0.6px; }
  .dial-arrow {
    width: 100%; height: 38px; border: none; border-radius: 13px;
    background: linear-gradient(180deg, #fde047, #f59e0b); color: #451a03;

  .dial-arrow:active { transform: translateY(2px); box-shadow: 0 1px 0 #b45309; }

  .dial-window {
    width: 100%; flex: 1; min-height: 68px; border-radius: 16px;
    background: linear-gradient(180deg, #cbd5e1 0%, #ffffff 24%, #ffffff 76%, #cbd5e1 100%);

    font-family: 'Fredoka', 'Nunito', sans-serif; font-size: clamp(22px, 3.2vw, 32px); font-weight: 700;

  .vault-dial.locked .dial-window { background: linear-gradient(180deg, #dcfce7, #ffffff 30%, #dcfce7); color: #166534; cursor: default; }
  .dial-dots { display: flex; gap: 5px; justify-content: center; }
  .dial-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.28); }
  .dial-dot.on { background: #fde047; transform: scale(1.3); }

  .spell-top { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  .spell-tray {
    display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 11px;

    border: 2.5px solid rgba(255,255,255,0.22);

  .letter-tile {
    min-width: clamp(54px, 6.8vw, 72px); height: clamp(58px, 8vh, 74px); padding: 0 14px;

  function getGameT(lang) {
    const dict = GAME_I18N[lang] || GAME_I18N.ru;
    return function(key, vars) {
      let str = dict[key] != null ? dict[key] : (GAME_I18N.ru[key] != null ? GAME_I18N.ru[key] : key);
      if (vars) {
        Object.keys(vars).forEach(k => {
          str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), String(vars[k]));
        });
      }
      return str;
    };
  }

  function shuffleArr(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function escHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function normAnswer(str) {
    return String(str || '').trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function matchesAnswer(userVal, targetVal) {
    const u = normAnswer(userVal);
    const t = normAnswer(targetVal);
    if (!u) return false;
    if (u === t) return true;
    return t.split('/').map(s => s.trim()).includes(u);
  }

  function fakeRegularForm(v1) {
    const base = String(v1 || '').trim().toLowerCase().split('/')[0];
    if (!base) return 'played';
    if (base.endsWith('e')) return base + 'd';
    if (/[bcdfghjklmnpqrstvwxyz]y$/.test(base)) return base.slice(0, -1) + 'ied';
    return base + 'ed';
  }

  function buildOptions(verb, targetKey, allVerbs, count) {
    const correct = String(verb[targetKey] || '').trim();
    const pool = new Set();
    const addCandidate = (w) => {
      const clean = String(w || '').trim();
      if (clean && normAnswer(clean) !== normAnswer(correct)) pool.add(clean);
    };

    if (Array.isArray(verb.distractors)) verb.distractors.forEach(addCandidate);
    addCandidate(fakeRegularForm(verb.v1));
    ['v1', 'v2', 'v3'].forEach(k => { if (k !== targetKey) addCandidate(verb[k]); });

    const others = shuffleArr(allVerbs);
    for (const o of others) {
      if (pool.size >= count + 3) break;
      addCandidate(o[targetKey]);
      addCandidate(o.v2);
      addCandidate(o.v3);
    }

    const distractors = shuffleArr(Array.from(pool)).slice(0, Math.max(1, count - 1));
    return shuffleArr([correct, ...distractors]);
  }

  function createSoundFX(themeCfg) {
    let ctx = null;
    const custom = {
      correct: (themeCfg && themeCfg.sfxCorrect) || '',
      wrong: (themeCfg && themeCfg.sfxWrong) || '',
      win: (themeCfg && themeCfg.sfxWin) || ''
    };
    const sfxVol = typeof (themeCfg && themeCfg.sfxVolume) === 'number' ? themeCfg.sfxVolume : 0.75;

    function getCtx() {
      if (!ctx) {
        const AC = global.AudioContext || global.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    }

    function tone(freq, dur, type, vol, delay) {
      const c = getCtx();
      if (!c) return;
      const now = c.currentTime + (delay || 0);
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime((vol || 0.14) * sfxVol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    return {
      play(kind, muted) {
        if (muted || sfxVol <= 0) return;
        if (custom[kind]) {
          try {
            const a = new Audio(custom[kind]);
            a.volume = Math.max(0, Math.min(1, sfxVol));
            a.play().catch(() => {});
            return;
          } catch (_) {}
        }
        if (kind === 'correct') {
          tone(523.25, 0.12, 'triangle', 0.22, 0);
          tone(659.25, 0.14, 'triangle', 0.22, 0.08);
          tone(783.99, 0.22, 'triangle', 0.24, 0.16);
        } else if (kind === 'wrong') {
          tone(240, 0.14, 'sawtooth', 0.16, 0);
          tone(180, 0.22, 'sawtooth', 0.16, 0.1);
        } else if (kind === 'pop') {
          tone(440, 0.08, 'sine', 0.2, 0);
          tone(720, 0.09, 'sine', 0.16, 0.04);
        } else if (kind === 'click') {
          tone(620, 0.045, 'triangle', 0.14, 0);
        } else if (kind === 'win') {
          [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.22, i * 0.1));
        }
      }
    };
  }

              x: 14 + i * laneW + Math.random() * Math.max(8, laneW - bubbleW),

                  b.y = field.clientHeight + 30;
                  b.alive = true;
                }, 700);
              }
            });

            return b;
          });

          let lastTs = performance.now();
          function tick(ts) {
            if (destroyed) return;
            const dt = Math.min(0.05, (ts - lastTs) / 1000);
            lastTs = ts;
            const curW = Math.max(280, field.clientWidth);
            const curH = Math.max(220, field.clientHeight);
            bubbles.forEach(b => {
              if (!b.alive) return;
              b.y -= b.vy * dt;
              b.phase += dt * 2.1;
              if (b.y < -150) {
                b.y = curH + 20;
                b.x = Math.max(10, Math.min(curW - bubbleW - 10, b.x + (Math.random() * 50 - 25)));
              }
              const swayX = Math.max(6, Math.min(curW - bubbleW - 6, b.x + Math.sin(b.phase) * 18));
              b.el.style.transform = `translate3d(${swayX}px, ${b.y}px, 0)`;
            });
            rafId = requestAnimationFrame(tick);
          }
          rafId = requestAnimationFrame(tick);
        }

        startRound();
        return { destroy() { destroyed = true; stopLoop(); } };
      }

          });
          let cursor = slots.findIndex(s => !s.filled);
          if (cursor === -1) cursor = slots.length;

          const tileList = [];
          slots.forEach((s, si) => { if (!s.filled) tileList.push({ id: 't_' + si, ch: s.ch, used: false }); });
          for (let e = 0; e < extraCount; e++) {
            tileList.push({ id: 'd_' + e, ch: decoyAlphabet[Math.floor(Math.random() * decoyAlphabet.length)], used: false });
          }
          const tiles = shuffleArr(tileList);

          function paint() {
            stageEl.innerHTML = `
              <div class="tpl-spelling">
                <div class="spell-board">
                  <div class="spell-top">
                    <div class="vg-target-badge" style="background:linear-gradient(90deg,#f59e0b,#ea580c);">
                      ${escHtml(targetKey === 'v2' ? t('splNeedV2') : t('splNeedV3'))}
                    </div>
                    <div class="spell-head">
                      ${verbImg}
                      <h2 class="spell-v1">${escHtml(verb.v1)}</h2>
                      <button class="vg-icon-btn" id="vgSpellSpeak" title="${escHtml(t('speakTitle'))}">🔊</button>
                    </div>
                    <div class="spell-trans">«${escHtml(verb.translation)}» • ${escHtml(t('splWordProg', { i: idx + 1, n: ctx.verbs.length }))}</div>
                  </div>
                  <div class="spell-slots">
                    ${slots.map((s, si) => {
                      if (s.isSpacer) return `<div class="spell-slot spacer">${escHtml(s.ch)}</div>`;
                      const cls = s.isHint ? 'hint' : (s.filled ? 'filled' : (si === cursor ? 'active' : ''));
                      return `<div class="spell-slot ${cls}">${s.filled ? escHtml(s.ch) : ''}</div>`;
                    }).join('')}
                  </div>
                  <div>
                    <div class="spell-tray">
                      ${tiles.map(tl => `<button class="letter-tile ${tl.used ? 'used' : ''}" data-tid="${tl.id}" ${tl.used ? 'disabled' : ''}>${escHtml(tl.ch)}</button>`).join('')}
                    </div>
                    <div class="spell-tip">${escHtml(t('splTip'))}</div>
                  </div>
                </div>
              </div>`;

            stageEl.querySelector('#vgSpellSpeak').addEventListener('click', () => ctx.host.speak(verb.v1));
            stageEl.querySelectorAll('.letter-tile').forEach(btn => {
              btn.addEventListener('click', () => pickTile(btn.dataset.tid, btn));
            });
          }

          function pickTile(tid, btnEl) {
            if (locked || cursor >= slots.length) return;
            const tile = tiles.find(tl => tl.id === tid);
            if (!tile || tile.used) return;
            if (tile.ch.toLowerCase() === slots[cursor].ch.toLowerCase()) {
              tile.used = true;
              slots[cursor].filled = true;
              ctx.host.sfx('pop');
              cursor = slots.findIndex(s => !s.filled);
              if (cursor === -1) {
                cursor = slots.length;
                locked = true;
                paint();
                ctx.host.onCorrect(verb, `${verb.v1} → ${rawWord}`, rawWord);
                idx++;
                setTimeout(() => { if (!destroyed) render(); }, 900);
              } else {
                paint();
              }
            } else {
              if (btnEl) {
                btnEl.classList.remove('wrong');
                void btnEl.offsetWidth;
                btnEl.classList.add('wrong');
              }
              if (!ctx.host.onWrong(verb, t('splWrong'))) locked = true;
            }
          }

          keyHandler = (e) => {
            if (destroyed || locked || (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) return;
            if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
            const ch = e.key.toLowerCase();
            if (!/[a-z]/.test(ch)) return;
            const match = tiles.find(tl => !tl.used && tl.ch.toLowerCase() === ch);
            if (match) pickTile(match.id, stageEl.querySelector(`[data-tid="${match.id}"]`));
          };
          document.addEventListener('keydown', keyHandler);
          paint();
        }

        render();
        return { destroy() { destroyed = true; clearKey(); } };
      }
    },

    /* 7. ТРОЙНОЕ МЕМОРИ */
    memory: {
      id: 'memory',
      icon: '🃏',
      nameKey: 'tpl_memory_name',
      descKey: 'tpl_memory_desc',
      extraControls: [
        {
          key: 'matchMode',
          labelKey: 'ctrl_mem_mode',
          type: 'select',
          options: [
            { value: 'auto', labelKey: 'opt_mem_auto' },
            { value: 'v1_v2', labelKey: 'opt_mem_v12' },
            { value: 'trans_v2', labelKey: 'opt_mem_tr2' },
            { value: 'v1_v2_v3', labelKey: 'opt_mem_v123' }
          ]
        },
        {
          key: 'verbsPerBoard',
          labelKey: 'ctrl_mem_per',
          type: 'select',
          options: [
            { value: '4', labelKey: 'opt_mem_p4' },
            { value: '6', labelKey: 'opt_mem_p6' },
            { value: 'all', labelKey: 'opt_mem_all' }
          ]
        },
        {
          key: 'peekSec',
          labelKey: 'ctrl_mem_peek',
          type: 'select',
          options: [
            { value: '0', labelKey: 'opt_mem_pk0' },
            { value: '2', labelKey: 'opt_mem_pk2' },
            { value: '4', labelKey: 'opt_mem_pk4' }
          ]
        },
        { key: 'showFormBadge', labelKey: 'ctrl_mem_badge', type: 'checkbox' }
      ],
      mount(stageEl, ctx) {
        let destroyed = false;
        const timers = [];
        const cfg = ctx.config || {}, t = ctx.t;
        const showBadge = cfg.showFormBadge !== false;
        const peekMs = (parseInt(cfg.peekSec, 10) || 0) * 1000;
        const customBack = (ctx.theme && ctx.theme.customMascot) || '';
        const later = (fn, ms) => { const id = setTimeout(() => { if (!destroyed) fn(); }, ms); timers.push(id); };

        const effMode = (cfg.matchMode === 'auto' || !cfg.matchMode)
          ? (ctx.settings.formsMode === 'v1_v2' ? 'v1_v2' : 'v1_v2_v3')
          : cfg.matchMode;

        const modeDefs = {
          v1_v2: {
            label: t('memModeV12'),
            slots: [{ key: 'v1', tag: 'V1', cls: 'v1' }, { key: 'v2', tag: 'V2', cls: 'v2' }]
          },
          trans_v2: {
            label: t('memModeTr2'),
            slots: [{ key: 'translation', tag: t('transTag'), cls: 'trans' }, { key: 'v2', tag: 'V2', cls: 'v2' }]
          },
          v1_v2_v3: {
            label: t('memModeV123'),
            slots: [
              { key: 'v1', tag: 'V1', cls: 'v1' },
              { key: 'v2', tag: 'V2', cls: 'v2' },
              { key: 'v3', tag: 'V3', cls: 'v3' }
            ]
          }
        };

        const modeInfo = modeDefs[effMode] || modeDefs.v1_v2_v3;
        const groupSize = modeInfo.slots.length;
        const perBoard = cfg.verbsPerBoard === 'all' ? ctx.verbs.length : (parseInt(cfg.verbsPerBoard, 10) || 4);
        const rounds = [];
        for (let i = 0; i < ctx.verbs.length; i += Math.max(1, perBoard)) {
          rounds.push(ctx.verbs.slice(i, i + Math.max(1, perBoard)));
        }
        let roundIdx = 0;

        function renderRound() {
          if (roundIdx >= rounds.length) { ctx.host.finish(true); return; }
          const boardVerbs = rounds[roundIdx];
          let matchedVerbs = 0, boardLocked = peekMs > 0, opened = [];
          const deck = [];

          boardVerbs.forEach((verb, vi) => {
            modeInfo.slots.forEach((slot, si) => {
              deck.push({
                uid: `c_${vi}_${si}`,
                groupId: `g_${roundIdx}_${vi}`,
                verb,
                tag: slot.tag,
                tagCls: slot.cls,
                text: slot.key === 'translation' ? (verb.translation || verb.v1) : (verb[slot.key] || verb.v2 || verb.v1),
                showThumb: (slot.key === 'v1' || slot.key === 'translation') && !!verb.image,
                matched: false,
                flipped: peekMs > 0
              });
            });
          });

          const cards = shuffleArr(deck);
          const totalCards = cards.length;
          const cols = totalCards <= 4 ? 2 : (totalCards <= 6 ? 3 : (totalCards <= 12 ? 4 : (totalCards <= 15 ? 5 : 6)));

          stageEl.innerHTML = `
            <div class="tpl-memory">
              <div class="mem-topbar">
                <span class="mem-badge-pill">${escHtml(modeInfo.label)}</span>
                <span id="vgMemStatus">${escHtml(peekMs > 0 ? t('memPeek') : t('memFound', { i: 0, n: boardVerbs.length }))}</span>
                ${rounds.length > 1 ? `<span>${escHtml(t('memRound', { i: roundIdx + 1, n: rounds.length }))}</span>` : ''}
              </div>
              <div class="mem-grid" id="vgMemGrid" style="--mem-cols:${cols};">
                ${cards.map(c => `
                  <button class="mem-card ${c.flipped ? 'flipped' : ''}" data-uid="${c.uid}" type="button">
                    <div class="mem-inner">
                      <div class="mem-face mem-front">${customBack ? `<img src="${escHtml(customBack)}" alt="">` : '✦'}</div>
                      <div class="mem-face mem-back">
                        ${showBadge ? `<span class="mem-tag ${c.tagCls}">${escHtml(c.tag)}</span>` : ''}
                        ${c.showThumb ? `<img class="mem-thumb" src="${escHtml(c.verb.image)}" alt="">` : ''}
                        <div class="mem-word">${escHtml(c.text)}</div>
                      </div>
                    </div>
                  </button>`).join('')}
              </div>
            </div>`;

          const statusEl = stageEl.querySelector('#vgMemStatus');
          const gridEl = stageEl.querySelector('#vgMemGrid');

          if (peekMs > 0) {
            later(() => {
              cards.forEach(c => {
                c.flipped = false;
                const el = gridEl.querySelector(`[data-uid="${c.uid}"]`);
                if (el) el.classList.remove('flipped');
              });
              boardLocked = false;
              statusEl.textContent = t('memFound', { i: 0, n: boardVerbs.length });
            }, peekMs);
          }

          gridEl.querySelectorAll('.mem-card').forEach(btn => {
            btn.addEventListener('click', () => {
              if (boardLocked) return;
              const card = cards.find(c => c.uid === btn.dataset.uid);
              if (!card || card.matched || card.flipped) return;
              card.flipped = true;
              btn.classList.add('flipped');
              ctx.host.sfx('click');
              opened.push({ card, el: btn });

              if (opened.length >= 2) {
                const firstGroup = opened[0].card.groupId;
                if (!opened.every(o => o.card.groupId === firstGroup)) {
                  boardLocked = true;
                  opened.forEach(o => o.el.classList.add('mismatch'));
                  if (!ctx.host.onWrong(opened[0].card.verb, t('memWrong'))) return;
                  later(() => {
                    opened.forEach(o => {
                      o.card.flipped = false;
                      o.el.classList.remove('flipped', 'mismatch');
                    });
                    opened = [];
                    boardLocked = false;
                  }, 820);
                  return;
                }

                if (opened.length === groupSize) {
                  boardLocked = true;
                  const mv = opened[0].card.verb;
                  opened.forEach(o => {
                    o.card.matched = true;
                    o.el.classList.add('matched');
                  });
                  matchedVerbs++;
                  statusEl.textContent = t('memFound', { i: matchedVerbs, n: boardVerbs.length });
                  const combo = modeInfo.slots
                    .map(s => s.key === 'translation' ? (mv.translation || mv.v1) : mv[s.key])
                    .join(' — ');
                  const spoken = modeInfo.slots
                    .filter(s => s.key !== 'translation')
                    .map(s => mv[s.key])
                    .join(', ');
                  ctx.host.onCorrect(mv, combo, spoken);
                  opened = [];
                  if (matchedVerbs >= boardVerbs.length) later(() => { roundIdx++; renderRound(); }, 950);
                  else later(() => { boardLocked = false; }, 220);
                }
              }
            });
          });
        }

        renderRound();
        return { destroy() { destroyed = true; timers.forEach(id => clearTimeout(id)); } };
      }
    }
  };

  /* =========================================================
     ИГРОВОЕ ЯДРО (GameHost) — мультиязычное
     ========================================================= */
  function mount(container, rawConfig, options) {
    const config = JSON.parse(JSON.stringify(rawConfig));
    const opts = options || {};
    const lang = (config.settings && config.settings.lang) || 'ru';
    const t = getGameT(lang);
    const screens = config.screens || {};
    const startCfg = screens.start || {};
    const endCfg = screens.end || {};
    const sfxEngine = createSoundFX(config.theme || {});

    let activeTemplateId = config.settings.templateId || 'boss';
    let activeInstance = null, timerInterval = null, confettiRaf = null, bgAudio = null;
    let muted = false, score = 0, correctCount = 0, totalAttempts = 0;
    let livesLeft = config.settings.lives, timeLeft = config.settings.timerSec;
    let runVerbs = [], mistakeMap = new Map(), isRetryMode = false;

    const root = document.createElement('div');
    root.className = 'vg-root';
    root.dataset.palette = (config.theme && config.theme.palette) || 'auto-template';
    root.dataset.template = activeTemplateId;

    container.innerHTML = '';
    container.appendChild(root);

    root.innerHTML = `
      <div class="vg-scene-layer" id="vgSceneLayer"></div>
      <div class="vg-bg-overlay"></div>
      <canvas class="vg-confetti"></canvas>
      <div class="vg-hud">
        <div class="vg-hud-group">
          <div class="vg-pill">⭐ <span id="vgScore">0</span></div>
          <div class="vg-progress-wrap"><div class="vg-progress-fill" id="vgProgress"></div></div>
          <div class="vg-pill retry-badge" id="vgRetryBadge" style="display:none;">${escHtml(t('retryBadge'))}</div>
          <div class="vg-pill" id="vgLivesPill" style="display:none;"></div>
          <div class="vg-pill" id="vgTimerPill" style="display:none;">⏱️ <span id="vgTimer">0</span>${escHtml(t('secUnit'))}</div>
        </div>
        <div class="vg-hud-group">
          <select class="vg-mode-select" id="vgModeSwitch" style="display:none;"></select>
          <button class="vg-icon-btn" id="vgMuteBtn" title="${escHtml(t('muteTitle'))}">🔊</button>
          <button class="vg-icon-btn" id="vgFsBtn" title="${escHtml(t('fsTitle'))}">⛶</button>
        </div>
      </div>
      <div class="vg-stage" id="vgStage"></div>
      <div class="vg-feedback-banner" id="vgFeedback"></div>
      <div class="vg-credit" id="vgCredit"></div>`;

    const sceneLayer = root.querySelector('#vgSceneLayer');
    const stageEl = root.querySelector('#vgStage');
    const scoreEl = root.querySelector('#vgScore');
    const progEl = root.querySelector('#vgProgress');
    const retryBadge = root.querySelector('#vgRetryBadge');
    const livesPill = root.querySelector('#vgLivesPill');
    const timerPill = root.querySelector('#vgTimerPill');
    const timerEl = root.querySelector('#vgTimer');
    const fbEl = root.querySelector('#vgFeedback');
    const modeSwitch = root.querySelector('#vgModeSwitch');
    const muteBtn = root.querySelector('#vgMuteBtn');
    const fsBtn = root.querySelector('#vgFsBtn');
    const creditEl = root.querySelector('#vgCredit');
    const confettiCanvas = root.querySelector('.vg-confetti');

    function applyScreenVisual(screenKind) {
      root.dataset.template = activeTemplateId;
      sceneLayer.innerHTML = getSceneSvg(activeTemplateId);
      let bg = (config.theme && config.theme.bgImage) || '';
      if (screenKind === 'start' && startCfg.bgImage) bg = startCfg.bgImage;
      if (screenKind === 'end' && endCfg.bgImage) bg = endCfg.bgImage;

      if (bg) {
        root.classList.add('has-custom-bg');
        root.style.backgroundImage = `url("${bg}")`;
      } else {
        root.classList.remove('has-custom-bg');
        root.style.backgroundImage = '';
      }
    }

    if (config.meta && config.meta.authorText) {
      creditEl.innerHTML = config.meta.authorUrl
        ? `<a href="${escHtml(config.meta.authorUrl)}" target="_blank" rel="noopener">${escHtml(config.meta.authorText)}</a>`
        : escHtml(config.meta.authorText);
    } else {
      creditEl.style.display = 'none';
    }

    if (config.settings.allowModeSwitch) {
      modeSwitch.style.display = 'inline-block';
      modeSwitch.innerHTML = Object.values(TEMPLATES)
        .map(tp => `<option value="${tp.id}" ${tp.id === activeTemplateId ? 'selected' : ''}>${tp.icon} ${escHtml(t(tp.nameKey))}</option>`)
        .join('');
      modeSwitch.addEventListener('change', () => {
        activeTemplateId = modeSwitch.value;
        startGame();
      });
    }

    muteBtn.addEventListener('click', () => {
      muted = !muted;
      muteBtn.textContent = muted ? '🔇' : '🔊';
      if (bgAudio) bgAudio.muted = muted;
    });

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) (root.requestFullscreen || root.webkitRequestFullscreen || (() => {})).call(root);
      else (document.exitFullscreen || (() => {})).call(document);
    });

    let fbTimer = null;
    function showFeedback(text, kind) {
      if (!text) return;
      clearTimeout(fbTimer);
      fbEl.textContent = text;
      fbEl.className = `vg-feedback-banner show ${kind || ''}`;
      fbTimer = setTimeout(() => fbEl.classList.remove('show'), 1400);
    }

    function speak(text) {
      if (muted || !text) return;
      const ttsLang = config.settings.ttsLang || 'en-US';
      if (ttsLang === 'off' || !global.speechSynthesis) return;
      try {
        global.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text).replace(/\//g, ', '));
        u.lang = ttsLang;
        u.rate = 0.92;
        global.speechSynthesis.speak(u);
      } catch (_) {}
    }

    function updateHud() {
      scoreEl.textContent = score;
      progEl.style.width = (runVerbs.length ? Math.round((correctCount / runVerbs.length) * 100) : 0) + '%';
      retryBadge.style.display = isRetryMode ? 'inline-flex' : 'none';
      if (config.settings.lives > 0) {
        livesPill.style.display = 'inline-flex';
        livesPill.textContent = '❤️'.repeat(Math.max(0, livesLeft)) + '🤍'.repeat(Math.max(0, config.settings.lives - livesLeft));
      } else {
        livesPill.style.display = 'none';
      }
      if (config.settings.timerSec > 0) {
        timerPill.style.display = 'inline-flex';
        timerEl.textContent = Math.max(0, timeLeft);
      } else {
        timerPill.style.display = 'none';
      }
    }

    function stopTimersAndTemplate() {
      if (activeInstance && typeof activeInstance.destroy === 'function') activeInstance.destroy();
      activeInstance = null;
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (confettiRaf) { cancelAnimationFrame(confettiRaf); confettiRaf = null; }
      const c2d = confettiCanvas.getContext('2d');
      if (c2d) c2d.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }

    function launchConfetti() {
      confettiCanvas.width = root.clientWidth || 640;
      confettiCanvas.height = root.clientHeight || 420;
      const c = confettiCanvas.getContext('2d');
      const colors = ['#fde047', '#4ade80', '#38bdf8', '#f472b6', '#fb923c', '#a78bfa'];
      const pieces = Array.from({ length: 90 }, () => ({
        x: Math.random() * confettiCanvas.width,
        y: -20 - Math.random() * 140,
        r: 5 + Math.random() * 6,
        vx: (Math.random() - 0.5) * 3,
        vy: 2.5 + Math.random() * 4,
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 10,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));
      function frame() {
        c.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        let active = false;
        pieces.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
          if (p.y < confettiCanvas.height + 20) active = true;
          c.save();
          c.translate(p.x, p.y);
          c.rotate(p.rot * Math.PI / 180);
          c.fillStyle = p.color;
          c.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6);
          c.restore();
        });
        if (active) confettiRaf = requestAnimationFrame(frame);
      }
      confettiRaf = requestAnimationFrame(frame);
    }

    function buildRewardBadgeHtml(won, acc) {
      if (endCfg.showRewardBadge === false) return '';
      if (won) {
        const styleCls = 'style-' + (endCfg.rewardStyle || 'gold');
        let title = endCfg.winBadgeTitle || t('defaultWinTitle');
        let subLabel = t('rewardSubDef');
        if (endCfg.tieredTitles) {
          if (acc >= 90) { subLabel = t('rewardSubHigh'); }
          else if (acc >= 65) { subLabel = t('rewardSubMid'); title = t('rewardTitleMid'); }
          else { subLabel = t('rewardSubLow'); title = t('rewardTitleLow'); }
        }
        const icoHtml = endCfg.winBadgeImage
          ? `<img src="${escHtml(endCfg.winBadgeImage)}" alt="Badge">`
          : escHtml(endCfg.winBadgeIcon || '🏆');
        return `
          <div class="vg-reward-card ${styleCls}">
            <div class="vg-reward-ico">${icoHtml}</div>
            <div class="vg-reward-meta">
              <div class="rk">${escHtml(subLabel)}</div>
              <div class="rt">${escHtml(title)}</div>
            </div>
          </div>`;
      }
      return `
        <div class="vg-reward-card style-try">
          <div class="vg-reward-ico">${escHtml(endCfg.loseBadgeIcon || '🛡️')}</div>
          <div class="vg-reward-meta">
            <div class="rk">${escHtml(t('rewardSubTry'))}</div>
            <div class="rt">${escHtml(endCfg.loseBadgeTitle || t('defaultLoseTitle'))}</div>
          </div>
        </div>`;
    }

    function finish(won, silentPreview) {
      stopTimersAndTemplate();
      applyScreenVisual('end');
      if (!silentPreview) {
        if (won) { sfxEngine.play('win', muted); launchConfetti(); }
        else sfxEngine.play('wrong', muted);
      }

      const mistakeList = Array.from(mistakeMap.values());
      const acc = totalAttempts ? Math.round((correctCount / totalAttempts) * 100) : 0;
      const stars = !won ? '⭐' : (acc >= 90 ? '⭐⭐⭐' : (acc >= 65 ? '⭐⭐' : '⭐'));
      const heading = won
        ? (isRetryMode && !mistakeList.length ? t('fixedHeading') : t('winHeading'))
        : t('endHeading');
      const slogan = won
        ? (config.theme.winSlogan || t('defaultWinSlogan'))
        : (config.theme.loseSlogan || t('defaultLoseSlogan'));

      if (!silentPreview) {
        try {
          global.parent.postMessage({
            type: 'VERB_GAME_COMPLETE',
            won,
            score,
            maxScore: runVerbs.length * (config.settings.pointsPerCorrect || 10),
            accuracy: acc,
            mistakesCount: mistakeList.length,
            isRetryMode,
            templateId: activeTemplateId,
            lang
          }, '*');
        } catch (_) {}
      }

      const rewardHtml = buildRewardBadgeHtml(won, acc);
      const starsHtml = endCfg.showStars !== false ? `<div class="vg-stars">${stars}</div>` : '';
      const mistakesBlock = mistakeList.length > 0
        ? `<div class="vg-mistakes-box"><div class="vg-mistakes-title">${escHtml(t('mistakesTitle', { n: mistakeList.length }))}</div><div class="vg-mistakes-chips">${mistakeList.map(v => `<span class="vg-mistake-chip">${escHtml(v.v1)}${v.translation ? ' — ' + escHtml(v.translation) : ''}</span>`).join('')}</div></div>`
        : (won ? `<div class="vg-perfect-badge">${escHtml(t('perfectBadge'))}</div>` : '');

      const retryBtnHtml = mistakeList.length > 0
        ? `<button class="vg-cta retry" id="vgRetryMistakesBtn">${escHtml(t('btnRetryMistakes', { n: mistakeList.length }))}</button>`
        : '';

      stageEl.innerHTML = `
        <div class="vg-screen">
          <h1>${escHtml(heading)}</h1>
          ${starsHtml}
          ${rewardHtml}
          <p>${escHtml(slogan)}</p>
          <div class="vg-stats-grid">
            <div class="vg-stat-box"><div class="val">${score}</div><div class="lbl">${escHtml(t('statScore'))}</div></div>
            <div class="vg-stat-box"><div class="val">${correctCount}/${runVerbs.length}</div><div class="lbl">${escHtml(t('statVerbs'))}</div></div>
            <div class="vg-stat-box"><div class="val">${acc}%</div><div class="lbl">${escHtml(t('statAcc'))}</div></div>
          </div>
          ${mistakesBlock}
          <div class="vg-screen-actions">
            ${retryBtnHtml}
            <button class="vg-cta" id="vgReplayBtn">${escHtml(isRetryMode ? t('btnReplayAll') : t('btnReplay'))}</button>
          </div>
        </div>`;

      const retryBtn = stageEl.querySelector('#vgRetryMistakesBtn');
      if (retryBtn) retryBtn.addEventListener('click', () => startGame(mistakeList));
      stageEl.querySelector('#vgReplayBtn').addEventListener('click', () => startGame());
    }

    function startGame(customVerbs) {
      stopTimersAndTemplate();
      applyScreenVisual('play');
      const validVerbs = (config.verbs || []).filter(v => v.v1 && v.v2);
      if (!validVerbs.length) {
        stageEl.innerHTML = `<div class="vg-screen"><div class="vg-screen-emblem">📚</div><h1>${escHtml(t('emptyTitle'))}</h1><p>${escHtml(t('emptyDesc'))}</p></div>`;
        return;
      }

      isRetryMode = Array.isArray(customVerbs) && customVerbs.length > 0;
      const sourceVerbs = isRetryMode ? customVerbs : validVerbs;
      runVerbs = config.settings.shuffle ? shuffleArr(sourceVerbs) : sourceVerbs.slice();
      mistakeMap = new Map();
      score = 0;
      correctCount = 0;
      totalAttempts = 0;
      livesLeft = config.settings.lives || 0;
      timeLeft = config.settings.timerSec || 0;
      updateHud();

      const musicVol = typeof (config.theme && config.theme.musicVolume) === 'number' ? config.theme.musicVolume : 0.3;
      if (config.theme && config.theme.bgMusic && !bgAudio) {
        bgAudio = new Audio(config.theme.bgMusic);
        bgAudio.loop = true;
      }
      if (bgAudio) {
        bgAudio.volume = Math.max(0, Math.min(1, musicVol));
        bgAudio.muted = muted;
        bgAudio.play().catch(() => {});
      }

      if (timeLeft > 0) {
        timerInterval = setInterval(() => {
          timeLeft--;
          updateHud();
          if (timeLeft <= 0) finish(false);
        }, 1000);
      }

      const tpl = TEMPLATES[activeTemplateId] || TEMPLATES.boss;
      const hostApi = {
        speak,
        sfx(kind) { sfxEngine.play(kind, muted); },
        onCorrect(verb, msg, spoken) {
          totalAttempts++;
          correctCount++;
          score += (config.settings.pointsPerCorrect || 10);
          sfxEngine.play('correct', muted);
          if (spoken) speak(spoken);
          showFeedback('🎉 ' + (msg || t('correctDef')), 'ok');
          updateHud();
        },
        onWrong(verb, msg) {
          totalAttempts++;
          if (verb) {
            const key = verb.id || (normAnswer(verb.v1) + '|' + normAnswer(verb.v2));
            if (!mistakeMap.has(key)) mistakeMap.set(key, verb);
          }
          sfxEngine.play('wrong', muted);
          showFeedback('💫 ' + (msg || t('wrongDef')), 'err');
          if (config.settings.lives > 0) {
            livesLeft--;
            updateHud();
            if (livesLeft <= 0) {
              setTimeout(() => finish(false), 550);
              return false;
            }
          }
          return true;
        },
        finish
      };

      activeInstance = tpl.mount(stageEl, {
        verbs: runVerbs,
        allVerbs: validVerbs,
        settings: config.settings,
        theme: config.theme || {},
        config: (config.templateConfig && config.templateConfig[tpl.id]) || {},
        host: hostApi,
        t,
        lang
      });
    }

    function showStartScreen() {
      stopTimersAndTemplate();
      applyScreenVisual('start');
      isRetryMode = false;
      const tpl = TEMPLATES[activeTemplateId] || TEMPLATES.boss;
      const count = (config.verbs || []).filter(v => v.v1 && v.v2).length;
      updateHud();

      const badgeText = startCfg.badgeText || t('defaultStartBadge');
      const badgeHtml = (startCfg.showBadge !== false && badgeText)
        ? `<div class="vg-start-badge">${escHtml(badgeText)}</div>`
        : '';
      const emblemHtml = startCfg.emblemImage
        ? `<div class="vg-screen-emblem has-img"><img src="${escHtml(startCfg.emblemImage)}" alt=""></div>`
        : `<div class="vg-screen-emblem">${tpl.icon}</div>`;
      const descHtml = startCfg.subtitle
        ? escHtml(startCfg.subtitle)
        : `${escHtml(t('startMode'))} <b>${escHtml(t(tpl.nameKey))}</b> • ${escHtml(t('startVerbs'))} <b>${count}</b><br>${escHtml(t(tpl.descKey))}`;

      stageEl.innerHTML = `
        <div class="vg-screen">
          ${badgeHtml}
          ${emblemHtml}
          <h1>${escHtml((config.meta && config.meta.title) || t('defaultTitle'))}</h1>
          <p>${descHtml}</p>
          <button class="vg-cta" id="vgStartBtn">${escHtml((config.theme && config.theme.startBtnText) || t('defaultStartBtn'))}</button>
        </div>`;
      stageEl.querySelector('#vgStartBtn').addEventListener('click', () => startGame());
    }

    function showEndPreview() {
      const valid = (config.verbs || []).filter(v => v.v1 && v.v2);
      runVerbs = valid.length ? valid : [{ id: 'p1', v1: 'buy', v2: 'bought', v3: 'bought', translation: 'buy' }];
      correctCount = runVerbs.length;
      totalAttempts = runVerbs.length + 1;
      score = runVerbs.length * (config.settings.pointsPerCorrect || 10);
      mistakeMap = new Map();
      if (runVerbs[0]) mistakeMap.set(runVerbs[0].id || 'm0', runVerbs[0]);
      updateHud();
      finish(true, true);
    }

    if (opts.initialView === 'play') startGame();
    else if (opts.initialView === 'end') showEndPreview();
    else showStartScreen();

    return {
      destroy() {
        stopTimersAndTemplate();
        if (bgAudio) { bgAudio.pause(); bgAudio = null; }
        container.innerHTML = '';
      }
    };
  }

  global.VerbGameEngine = { mount, TEMPLATES, GAME_I18N, getGameT };
})(window);
